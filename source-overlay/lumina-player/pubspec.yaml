name: lumina
description: Lumina - your personal media library. Videos, photos and reading, organized.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  video_player: ^2.9.1
  file_picker: ^8.1.7
  shared_preferences: ^2.3.2
  path: ^1.9.0
  http: ^1.2.2
  archive: ^3.6.1
  crypto: ^3.0.6
  path_provider: ^2.1.4
  fjs: ^3.3.2

dependency_overrides:
  # Keep the transitive Android lifecycle plugin compatible with file_picker's
  # compile SDK until all Flutter plugins in this project target API 36.
  flutter_plugin_android_lifecycle: 2.0.24

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
