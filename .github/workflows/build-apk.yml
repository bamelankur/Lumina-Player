name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q lumina-player.zip

      - name: Apply source overlay
        run: cp -a source-overlay/lumina-player/. lumina-player/

      - name: Set Android compile SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("lumina-player/android")
          files = list(root.rglob("build.gradle")) + list(root.rglob("build.gradle.kts"))
          changed = []
          for path in files:
              source = path.read_text()
              updated = source
              updated = re.sub(r'compileSdkVersion\s+34\b', 'compileSdkVersion 36', updated)
              updated = re.sub(r'compileSdkVersion\s*=\s*34\b', 'compileSdkVersion = 36', updated)
              updated = re.sub(r'compileSdk\s*=\s*34\b', 'compileSdk = 36', updated)
              updated = re.sub(r'compileSdkVersion\s+flutter\.compileSdkVersion', 'compileSdkVersion 36', updated)
              updated = re.sub(r'compileSdkVersion\s*=\s*flutter\.compileSdkVersion', 'compileSdkVersion = 36', updated)
              updated = re.sub(r'compileSdk\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 36', updated)
              if updated != source:
                  path.write_text(updated)
                  changed.append(str(path))
          print("Updated Android compile SDK in:", changed if changed else "no matching declarations found")
          app_gradle = [p for p in files if p.parent.name == "app"]
          app_sources = "\n".join(p.read_text() for p in app_gradle)
          if not re.search(r'compileSdk(?:Version)?\s*(?:=\s*)?36\b', app_sources):
              raise SystemExit("Could not confirm Android app compileSdk is set to 36.")
          PY

      # NEW: make sure the release APK is allowed to use the network.
      - name: Ensure Android INTERNET permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("lumina-player/android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          perm = '<uses-permission android:name="android.permission.INTERNET"/>'
          if "android.permission.INTERNET" in s:
              print("INTERNET permission already declared in main manifest")
          else:
              print("INTERNET permission MISSING from main manifest; adding it")
              i = s.index("<application")
              s = s[:i] + perm + "\n    " + s[i:]
              p.write_text(s)
          print(p.read_text())
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable

      - name: Get packages
        run: flutter pub get
        working-directory: lumina-player

      - name: Build APK
        run: flutter build apk --release
        working-directory: lumina-player

      # NEW: fail the build if the final APK still lacks the permission.
      - name: Verify INTERNET permission in built APK
        run: |
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          "$AAPT" dump permissions lumina-player/build/app/outputs/flutter-apk/app-release.apk | tee perms.txt
          grep -q "android.permission.INTERNET" perms.txt

      - name: Package Lumina demo module
        if: hashFiles('examples/lumina-demo/module.json') != ''
        run: |
          cd examples/lumina-demo
          zip -q ../../lumina-demo-module.zip module.json index.js

      - name: Upload Lumina demo module
        if: hashFiles('examples/lumina-demo/module.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: lumina-demo-module
          path: lumina-demo-module.zip

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lumina-release-apk
          path: lumina-player/build/app/outputs/flutter-apk/app-release.apk
