name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q lumina-player.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable

      - name: Get packages
        run: flutter pub get
        working-directory: lumina-player

      - name: Build APK
        run: flutter build apk --release
        working-directory: lumina-player

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lumina-release-apk
          path: lumina-player/build/app/outputs/flutter-apk/app-release.apk
